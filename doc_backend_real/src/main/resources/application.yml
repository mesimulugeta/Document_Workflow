server:
  port: 8081

spring:
  application:
    name: document-workflow-platform
  datasource:
    url: jdbc:mysql://localhost:3307/dwp?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:dwp_user}
    password: ${DB_PASSWORD:dwp_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/dwp
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  storage:
    endpoint: http://localhost:8333
    bucket: dwp-files
    region: us-east-1
    access-key: ${S3_ACCESS_KEY:dwpaccess}
    secret-key: ${S3_SECRET_KEY:dwpsecret123}

management:
  endpoints:
    web:
      exposure:
        include: health,info